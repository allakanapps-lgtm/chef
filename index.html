const ql=q.toLowerCase();for(const c of cats){const ks=Object.keys(IMAP).filter(k=>IMAP[k].c===c&&(!ql||ingName(k).toLowerCase().includes(ql)||IMAP[k].n.en.toLowerCase().includes(ql)));if(ks.length)h+='<div>'+ks.map(k=>`<span class="chip ${S.pantry.includes(k)?'on':''}" data-act="pan" data-k="${k}">${esc(ingName(k))}</span>`).join('')+'</div><hr style="border:0;border-top:1px solid var(--bd)">'}
if(S.pantry.length){h+=`<button class="btn s" data-act="clr">${esc(t('clear'))} (${S.pantry.length})</button><h2>${esc(t('tab_today'))}</h2>`;const res=rank(D.rec).filter(r=>score(r)>0).slice(0,10);h+=res.length?res.map(recRow).join(''):`<p class="mut">${esc(t('no_results'))}</p>`}}
if(view==='plan'){h+=`<h1>${esc(t('tab_plan'))}</h1><button class="btn w" data-act="mkplan">📅 ${esc(t('make_plan'))}</button>`;
S.plan.forEach((id,i)=>{const r=D.rec.find(x=>x.id===id);if(!r)return;const d=new Date(Date.now()+i*DAY);let dn='';try{dn=new Intl.DateTimeFormat(S.lang,{weekday:'long'}).format(d)}catch(e){dn=d.toDateString().slice(0,3)}h+=`<div class="r" data-act="open" data-id="${id}"><div><small>${esc(dn)}</small><b>${esc(recName(r))}</b></div><span class="mut">${r.m} ${esc(t('min'))}</span></div>`});}
if(view==='list'){h+=`<h1>${esc(t('tab_list'))}</h1>`;const need=shopList();if(!need.length)h+=`<p class="mut">${esc(t('shopping_empty'))}</p>`;else{h+=need.map(k=>`<div class="r" data-act="chk" data-k="${k}"><span class="${S.checked.includes(k)?'mut':''}" style="${S.checked.includes(k)?'text-decoration:line-through':''}">${S.checked.includes(k)?'☑':'☐'} ${esc(ingName(k))}</span></div>`).join('');h+=`<button class="btn w" data-act="copylist">${esc(t('copy'))}</button>`}}
if(view==='more')h+=moreView();
A.innerHTML=h+brandFoot();const qi=$('#q');if(qi){qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}}
function shopList(){const s=new Set();for(const id of S.plan){const r=D.rec.find(x=>x.id===id);if(r)real(r).forEach(x=>{if(!S.pantry.includes(x.k))s.add(x.k)})}return[...s]}
function moreView(){const ls=langs();let h=`<h1>${esc(t('tab_more'))}</h1><div class="card"><b>${esc(t('language'))}</b><select id="lg">${ls.map(l=>`<option value="${l.c}" ${l.c===S.lang?'selected':''}>${esc(l.name)}</option>`).join('')}</select><b>${esc(t('theme'))}</b><select id="th">${['auto','light','dark'].map(x=>`<option ${S.theme===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
const cnt=D.rec.filter(r=>r.p!=='free').length;
h+=`<div class="card"><h2 style="margin-top:0">⭐ ${esc(t('premium'))} (+${cnt})</h2>`;
if(S.unlocked.includes('p1'))h+=`<p class="ok">✔ ${esc(t('done'))}</p>`;
else{h+=`<a class="btn w" id="wa" target="_blank" rel="noopener" href="${waLink()}">💬 ${esc(t('whatsapp'))}</a><p class="mut">${esc(t('device'))}: <b dir="ltr" id="did">${S.did.replace(/(.{4})/g,'$1-').slice(0,-1)}</b></p><input id="code" dir="ltr" placeholder="${esc(t('code'))}" autocomplete="off"><button class="btn w" data-act="act">${esc(t('activate'))}</button><div id="amsg" class="no"></div>`}
h+='</div>';
h+=`<div class="card"><h2 style="margin-top:0">✨ ${esc(t('ask_gemini'))}</h2><div class="row"><button class="btn s" data-act="gask">${esc(t('copy'))} + Gemini</button></div><textarea id="ai" placeholder="${esc(t('paste_back'))}">${esc(S.ai)}</textarea><button class="btn s" data-act="aisave">${esc(t('save'))}</button></div>`;
h+=`<div class="card"><h2 style="margin-top:0">🌍 Translate app → any language</h2><input id="nl" placeholder="Language name (e.g. Swahili / Español / 日本語)"><select id="nd"><option value="ltr">LTR</option><option value="rtl">RTL</option></select><button class="btn s" data-act="packask">${esc(t('copy'))} + Gemini</button><textarea id="pk" dir="ltr" placeholder="${esc(t('paste_back'))} (JSON)"></textarea><button class="btn s" data-act="packsave">${esc(t('save'))}</button><div id="pmsg" class="no"></div></div>`;
h+=`<div class="card"><b>Allakan Apps</b><div class="mut">💬 <a href="https://wa.me/${WA}" target="_blank" rel="noopener" style="color:inherit" dir="ltr">+${WA}</a><br>✉️ <a href="mailto:${MAIL}" style="color:inherit">${MAIL}</a></div></div>`;return h}
function waLink(){const m=`Chef app (${BRAND}) - premium activation\nDevice ID: ${S.did}\nPack: p1`;return `https://wa.me/${WA}?text=${encodeURIComponent(m)}`}
async function copy(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast(t('copied'))}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
const langName=()=>(langs().find(l=>l.c===S.lang)||{name:'English'}).name;
function openRec(id){const r=D.rec.find(x=>x.id===id);if(!r)return;const lk=isLocked(r),rs=recSteps(r);
let h=`<div class="row" style="justify-content:space-between"><h1 style="margin:0">${esc(recName(r))}</h1><button class="btn s" data-act="close">✕</button></div><p class="mut">${r.m} ${esc(t('min'))} · ${esc(r.c)}</p><h2>${esc(t('ingredients'))}</h2><div class="card">`;
h+=r.i.map(x=>{const stp=IMAP[x.k].c==='staple';const have=stp||S.pantry.includes(x.k);const u=unit(x.u);return `<div class="row" style="justify-content:space-between"><span>${have?'<span class="ok">✔</span>':'<span class="no">✖</span>'} ${esc(ingName(x.k))}</span><span class="mut">${x.q?x.q+' ':''}${esc(u)}</span></div>`}).join('')+'</div>';
if(lk){h+=`<div class="card"><b>🔒 ${esc(t('premium'))}</b><a class="btn w" target="_blank" rel="noopener" href="${waLink()}">💬 ${esc(t('whatsapp'))}</a><button class="btn s w" data-act="gomore">${esc(t('unlock'))}</button></div>`}
else{h+=`<h2>${esc(t('steps'))}</h2><ol>${rs.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
if(rs.fb)h+=`<div class="card"><div class="mut">${esc(t('fallback'))}</div><button class="btn s" data-act="tsteps" data-id="${id}">${esc(t('translate'))}</button><textarea id="tt" placeholder="${esc(t('paste_back'))}"></textarea><button class="btn s" data-act="tsave" data-id="${id}">${esc(t('save'))}</button></div>`;
h+=`<button class="btn w" data-act="cooked" data-id="${id}">✅ ${esc(t('cooked'))}</button>`}
$('#sheet').innerHTML=h+brandFoot();$('#modal').classList.add('on');$('#modal').scrollTop=0}
const closeM=()=>$('#modal').classList.remove('on');
function mkPlan(){const el=rank(eligible());const loc=CUIS[S.lang];let pool=el.slice();const out=[];
// prefer pantry matches, mix cuisines, no repeats
while(out.length<7&&pool.length){const w=pool.slice(0,Math.max(4,Math.ceil(pool.length/2)));const r=w[Math.floor(Math.random()*w.length)];out.push(r.id);pool=pool.filter(x=>x.id!==r.id)}
S.plan=out;S.checked=[];save()}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
function der2raw(d){if(d[0]!==0x30)return null;let i=2;if(d[1]&0x80)i=2+(d[1]&0x7f);const rd=()=>{if(d[i]!==2)return null;let l=d[i+1];i+=2;let v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};const r=rd(),s=rd();if(!r||!s)return null;const o=new Uint8Array(64);o.set(r);o.set(s,32);return o}
async function verifyCode(code){const m=code.trim().match(/^([A-Za-z0-9]+)-([A-Za-z0-9_-]+)$/);if(!m||!crypto.subtle)return null;let sig=b64(m[2]);if(sig.length!==64)sig=der2raw(sig);if(!sig)return null;
const key=await crypto.subtle.importKey('spki',b64(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sig,new TextEncoder().encode(S.did+'|'+m[1]));return ok?m[1]:null}
function geminiPrompt(){const names=S.pantry.map(ingName).join(', ')||'(any)';return `I have these ingredients at home: ${names}.\nSuggest 3 dinner ideas I can cook, with short steps. Answer in ${langName()}.`}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
if(a==='tab'){view=el.dataset.v;closeM();render();window.scrollTo(0,0)}
else if(a==='open')openRec(el.dataset.id)
else if(a==='close')closeM()
else if(a==='rand'){pickToday(true);render()}
else if(a==='pan'){const k=el.dataset.k;S.pantry=S.pantry.includes(k)?S.pantry.filter(x=>x!==k):S.pantry.concat(k);save();const y=scrollY;render();scrollTo(0,y)}
else if(a==='clr'){S.pantry=[];save();render()}
else if(a==='mkplan'){mkPlan();render()}
else if(a==='chk'){const k=el.dataset.k;S.checked=S.checked.includes(k)?S.checked.filter(x=>x!==k):S.checked.concat(k);save();render()}
else if(a==='copylist'){copy(shopList().filter(k=>!S.checked.includes(k)).map(k=>'• '+ingName(k)).join('\n')+'\n\n'+BRAND)}
else if(a==='cooked'){S.hist=S.hist.filter(h=>h.id!==el.dataset.id);S.hist.push({id:el.dataset.id,t:Date.now()});S.hist=S.hist.slice(-200);if(S.today&&S.today.id===el.dataset.id)S.today=null;save();closeM();render()}
else if(a==='gomore'){closeM();view='more';render()}
else if(a==='act'){const m=$('#amsg');try{const p=await verifyCode($('#code').value);if(p){if(!S.unlocked.includes(p))S.unlocked.push(p);save();render()}else m.textContent='✖ '+t('invalid')}catch(x){m.textContent='✖ '+t('invalid')}}
else if(a==='gask'){copy(geminiPrompt());setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
else if(a==='aisave'){S.ai=$('#ai').value;save();toast(t('done'))}
else if(a==='tsteps'){const r=D.rec.find(x=>x.id===el.dataset.id);copy(`Translate this recipe into ${langName()}. Return only the translated steps, one per line.\n\n${recName(r)}\n`+r.s.en.map((s,i)=>(i+1)+'. '+s).join('\n'));setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
else if(a==='tsave'){const v=$('#tt').value.replace(/^\s*\d+[.)]\s*/gm,'').trim();if(v){S.notes[el.dataset.id+'|'+S.lang]=v;save();openRec(el.dataset.id)}}
else if(a==='packask'){const nm=$('#nl').value.trim();if(!nm)return;const en={ui:Object.fromEntries(UIK.map((k,i)=>[k,D.ui.en[i]])),ing:Object.fromEntries(Object.keys(IMAP).map(k=>[k,IMAP[k].n.en])),rec:Object.fromEntries(D.rec.map(r=>[r.id,r.n.en]))};
copy(`Translate every VALUE of this JSON from English into ${nm}. Keep the keys exactly. Return ONLY valid JSON, no explanations, no code fences.\n`+JSON.stringify(en));setTimeout(()=>window.open('https://gemini.google.com/app','_blank'),300)}
else if(a==='packsave'){const m=$('#pmsg'),nm=$('#nl').value.trim();try{let tx=$('#pk').value.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');const j=JSON.parse(tx);if(!j.ui||!nm)throw 0;let c=nm.toLowerCase().replace(/[^a-z0-9\u0080-￿]/g,'').slice(0,12)||'x'+Date.now();c='x-'+c;S.custom[c]={name:nm,dir:$('#nd').value,ui:j.ui,ing:j.ing||{},rec:j.rec||{}};S.lang=c;save();render()}catch(x){m.textContent='✖ JSON'}}});
document.addEventListener('change',e=>{if(e.target.id==='lg'){S.lang=e.target.value;save();render()}if(e.target.id==='th'){S.theme=e.target.value;save();render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
